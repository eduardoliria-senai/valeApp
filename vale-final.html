<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B6E63">
  <title>Vale — Serviços Ambientais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
   VALE INDUSTRIAL DESIGN SYSTEM — UI REFRESH
   Visual layer redesigned; application logic intentionally preserved.
   ================================================================ */
    :root {
      --vale: #007E7A;
      --vale-700: #00655F;
      --vale-800: #00524E;
      --vale-900: #073E3B;
      --gold: #E8B923;
      --gold-700: #C99B0D;
      --gold-soft: #FFF7D6;
      --slate-950: #16201F;
      --slate-900: #1D2A29;
      --slate-800: #2A3937;
      --slate-700: #43514F;
      --slate-600: #5F6D6B;
      --slate-500: #76827F;
      --slate-400: #98A29F;
      --slate-300: #C3CBC8;
      --slate-200: #DCE2DF;
      --slate-150: #E8ECEA;
      --slate-100: #F1F4F2;
      --slate-50: #F7F9F8;
      --surface: #FFFFFF;
      --bg: #EEF2F0;
      --text: #172220;
      --text2: #5F6D6B;
      --text3: #8E9996;
      --border: #DCE2DF;
      --border-strong: #C8D0CD;
      --red: #C53A42;
      --red-soft: #FDECEE;
      --warn: #A7640B;
      --warn-soft: #FFF2D8;
      --info: #2E6473;
      --info-soft: #E8F2F5;
      --ok: #237A59;
      --ok-soft: #E7F4EE;
      --teal: var(--vale);
      --teal-dark: var(--vale-800);
      --teal-light: #E3F3F1;
      --gold-dark: var(--gold-700);
      --gold-light: var(--gold-soft);
      --gray-footer: var(--slate-900);
      --gray-mid: var(--slate-500);
      --gray-bg: var(--bg);
      --radius: 8px;
      --radius-lg: 10px;
      --shadow: 0 1px 2px rgba(22, 32, 31, .06), 0 1px 3px rgba(22, 32, 31, .04);
      --shadow-lg: 0 8px 20px rgba(22, 32, 31, .10);
      --focus: 0 0 0 3px rgba(0, 126, 122, .18);
      --header-h: 72px;
      --nav-h: 60px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      font-family: 'Inter', 'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      height: 100%
    }

    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      touch-action: manipulation
    }

    img {
      display: block;
      max-width: 100%
    }

    a {
      color: inherit
    }

    ::selection {
      background: rgba(0, 126, 122, .18)
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--focus) !important
    }

    /* ================================================================
   BRAND
   ================================================================ */
    .vale-logo-img {
      display: block;
      object-fit: contain;
      height: auto
    }

    .login-logo {
      margin-bottom: 28px;
      align-self: flex-start
    }

    .login-logo .vale-logo-img {
      width: 164px;
      max-height: 74px
    }

    .login-brandmark {
      width: 172px;
      max-height: 80px;
      margin: 0 auto 26px;
      filter: brightness(0) invert(1);
      opacity: .98
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      padding: 5px 8px;
      min-width: 96px;
      height: 44px
    }

    .header-logo .vale-logo-img {
      width: 80px;
      max-height: 32px
    }

    /* ================================================================
   LOGIN — split corporate access screen
   ================================================================ */
    #login {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      grid-template-columns: minmax(420px, 46%) 1fr;
      background: var(--bg)
    }

    #login.hidden {
      display: none
    }

    .login-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(36px, 6vw, 88px);
      background: #fff;
      position: relative;
      border-right: 1px solid var(--border)
    }

    .login-left::before {
      content: 'VALE • SERVIÇOS AMBIENTAIS';
      position: absolute;
      top: 32px;
      left: clamp(36px, 6vw, 88px);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .16em;
      color: var(--slate-500)
    }

    .login-form {
      width: 100%;
      max-width: 390px
    }

    .login-form::before {
      content: 'Acesso ao sistema';
      display: block;
      font-size: 1.65rem;
      font-weight: 750;
      letter-spacing: -.03em;
      margin-bottom: 8px;
      color: var(--slate-950)
    }

    .login-form::after {
      content: 'Use sua matrícula corporativa para continuar.';
      display: block;
      font-size: .86rem;
      color: var(--text2);
      position: absolute;
      transform: translateY(-408px);
      pointer-events: none
    }

    .login-field {
      margin-bottom: 16px
    }

    .login-field label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: var(--slate-700);
      margin-bottom: 7px;
      letter-spacing: .02em
    }

    .login-field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #fff;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s
    }

    .login-field input:hover {
      border-color: var(--slate-400)
    }

    .login-field input:focus {
      border-color: var(--vale);
      box-shadow: var(--focus)
    }

    .login-field input::placeholder {
      color: #9BA5A2
    }

    .login-forgot {
      font-size: .76rem;
      color: var(--vale-700);
      margin: -2px 0 20px;
      display: inline-flex;
      text-decoration: none;
      font-weight: 650
    }

    .login-forgot:hover {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .btn-login {
      display: flex;
      width: 100%;
      height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      background: var(--vale-800);
      color: #fff;
      border: 1px solid var(--vale-800);
      border-radius: 7px;
      font-weight: 750;
      font-size: .9rem;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .08s
    }

    .btn-login:hover {
      background: var(--vale-900);
      border-color: var(--vale-900)
    }

    .btn-login:active {
      transform: translateY(1px)
    }

    .login-demo {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 390px
    }

    .login-demo p {
      font-size: .67rem;
      color: var(--slate-500);
      text-align: left;
      margin-bottom: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .09em
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .demo-btn {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--slate-50);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background .15s, border-color .15s, transform .08s
    }

    .demo-btn:hover {
      background: #fff;
      border-color: var(--vale)
    }

    .demo-btn:active {
      transform: translateY(1px)
    }

    .demo-btn strong {
      display: block;
      font-size: .78rem;
      color: var(--slate-900)
    }

    .demo-btn small {
      font-size: .65rem;
      color: var(--text2);
      margin-top: 2px;
      display: block
    }

    .login-right {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--vale-900), var(--vale-700));
      display: flex;
      align-items: center;
      justify-content: center
    }

    .login-right::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom right, black, transparent 84%)
    }

    .login-right::after {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      right: -180px;
      bottom: -160px
    }

    .login-right-inner {
      position: relative;
      z-index: 1;
      text-align: left;
      color: #fff;
      padding: 56px;
      max-width: 520px;
      width: 100%
    }

    .login-right-inner h2 {
      font-size: 2rem;
      font-weight: 720;
      letter-spacing: -.035em;
      margin-bottom: 12px
    }

    .login-right-inner p {
      font-size: .95rem;
      line-height: 1.6;
      opacity: .78;
      max-width: 420px
    }

    .login-right-inner::after {
      content: 'GESTÃO • MANUTENÇÃO • CONFIABILIDADE';
      display: block;
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, .18);
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .14em;
      opacity: .68
    }

    /* ================================================================
   APP SHELL — sidebar (desktop) + bottom nav (mobile)
   ================================================================ */
    #app {
      height: 100%;
      display: none;
      background: var(--bg);
      overflow: hidden
    }

    /* Desktop: sidebar left + main column right */
    @media(min-width:860px) {
      #app {
        display: none;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 1fr
      }

      #app[style*="flex"] {
        display: grid !important
      }

      .sidebar {
        display: flex
      }

      .nav {
        display: none !important
      }
    }

    /* Mobile: stack header + content + bottom nav */
    @media(max-width:859px) {
      #app {
        flex-direction: column
      }

      .sidebar {
        display: none !important
      }
    }

    /* ---- SIDEBAR ---- */
    .sidebar {
      flex-direction: column;
      background: var(--slate-950);
      border-right: 1px solid rgba(255, 255, 255, .06);
      overflow: hidden;
      z-index: 60;
      height: 100%;
    }

    .sb-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sb-logo .vale-logo-img {
      width: 84px;
      max-height: 34px
    }

    .sb-logo-label {
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--slate-500);
      margin-left: auto
    }

    .sb-section {
      padding: 10px 10px 6px
    }

    .sb-section-label {
      font-size: .56rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--slate-600);
      padding: 6px 8px 8px
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      margin-bottom: 2px;
      border-radius: 6px;
      color: var(--slate-400);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .12s;
      font-size: .8rem;
      font-weight: 600;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .sb-item:hover {
      background: var(--slate-800);
      color: var(--slate-200);
      border-color: rgba(255, 255, 255, .04)
    }

    .sb-item.active {
      background: rgba(0, 126, 122, .12);
      color: #5FD4CD;
      border-color: rgba(0, 126, 122, .18)
    }

    .sb-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: .7
    }

    .sb-item.active svg {
      opacity: 1
    }

    .sb-item .sb-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: .55rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center
    }

    .sb-user {
      margin-top: auto;
      padding: 14px;
      border-top: 1px solid rgba(255, 255, 255, .08)
    }

    .sb-user-row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .sb-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--slate-800);
      border: 1px solid rgba(255, 255, 255, .08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .65rem;
      flex-shrink: 0
    }

    .sb-user-info {
      min-width: 0
    }

    .sb-user-name {
      font-size: .78rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sb-user-role {
      font-size: .62rem;
      color: var(--slate-500);
      margin-top: 1px
    }

    .sb-logout {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, .06);
      background: transparent;
      color: var(--slate-500);
      cursor: pointer;
      font-size: .68rem;
      font-weight: 600;
      width: 100%;
      transition: all .12s
    }

    .sb-logout:hover {
      background: var(--slate-800);
      color: var(--slate-300)
    }

    .sb-logout svg {
      width: 14px;
      height: 14px
    }

    /* ---- Main column (header + content) ---- */
    .main-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%
    }

    .header {
      min-height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(14px, 2vw, 28px);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 50
    }

    .header-info {
      min-width: 0
    }

    .header-info .h-name {
      font-weight: 720;
      font-size: .88rem;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text)
    }

    .header-info .h-meta {
      font-size: .66rem;
      color: var(--text2);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .header-avatar {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--slate-100);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .65rem;
      cursor: pointer
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      min-width: 72px;
      height: 34px
    }

    .header-logo .vale-logo-img {
      width: 68px;
      max-height: 28px
    }

    /* Hide logo in header on desktop (shown in sidebar) */
    @media(min-width:860px) {
      .header-logo {
        display: none
      }
    }

    /* Gold accent line under header on mobile */
    @media(max-width:859px) {
      .header {
        border-bottom: 3px solid var(--gold);
        background: var(--slate-950)
      }

      .header-info .h-name {
        color: #fff
      }

      .header-info .h-meta {
        color: #B7C2BF
      }

      .header-avatar {
        background: var(--slate-800);
        border-color: rgba(255, 255, 255, .10);
        color: #fff
      }
    }

    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--bg)
    }

    /* ---- Bottom nav (mobile only) ---- */
    .nav {
      height: var(--nav-h);
      background: var(--slate-950);
      border-top: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(14px, 2vw, 28px);
      flex-shrink: 0;
      z-index: 50
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center
    }

    .nav-right {
      gap: 6px
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s, transform .08s
    }

    .nav-btn:hover {
      background: var(--slate-800);
      border-color: rgba(255, 255, 255, .08)
    }

    .nav-btn:active {
      transform: translateY(1px)
    }

    .nav-btn svg {
      width: 20px;
      height: 20px
    }

    .nav-btn.home-btn svg,
    .nav-btn.gold-btn svg {
      color: var(--gold)
    }

    .nav-btn.phone-btn svg {
      color: #E56B72
    }

    /* ================================================================
   PAGES / TYPOGRAPHY
   ================================================================ */
    .page {
      display: none;
      height: 100%;
      flex-direction: column;
      overflow: hidden
    }

    .page.active {
      display: flex
    }

    .page-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px clamp(14px, 2.4vw, 30px) 32px
    }

    .page-title {
      font-size: 1.32rem;
      font-weight: 760;
      letter-spacing: -.025em;
      margin-bottom: 18px;
      color: var(--slate-950)
    }

    .page-title::after {
      content: '';
      display: block;
      width: 36px;
      height: 3px;
      background: var(--gold);
      margin-top: 8px;
      border-radius: 2px
    }

    .section-label {
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--slate-600);
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .section-label::after {
      content: '';
      height: 1px;
      flex: 1;
      background: var(--border)
    }

    /* ================================================================
   HOME MODULES — industrial command tiles
   ================================================================ */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      padding: 22px clamp(14px, 2.4vw, 30px) 12px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto
    }

    .module-card {
      min-height: 132px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--vale);
      border-radius: 8px;
      color: var(--slate-900);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px;
      cursor: pointer;
      transition: transform .12s, border-color .15s, box-shadow .15s, background .15s;
      box-shadow: none;
      position: relative;
      overflow: hidden
    }

    .module-card::after {
      content: '';
      position: absolute;
      right: -24px;
      bottom: -34px;
      width: 84px;
      height: 84px;
      border: 1px solid var(--slate-150);
      border-radius: 50%;
      pointer-events: none
    }

    .module-card:hover {
      transform: translateY(-1px);
      border-color: #BCC8C4;
      box-shadow: 0 5px 14px rgba(22, 32, 31, .07);
      background: #FEFFFF
    }

    .module-card:active {
      transform: translateY(0)
    }

    .module-card .mc-title {
      font-weight: 780;
      font-size: .76rem;
      letter-spacing: .055em;
      text-transform: uppercase;
      text-align: left
    }

    .module-card .mc-icon {
      margin-top: auto;
      color: var(--vale);
      opacity: 1;
      border: 1px solid var(--border);
      background: var(--slate-50);
      width: 38px;
      height: 38px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1
    }

    .module-card .mc-icon svg {
      width: 20px;
      height: 20px
    }

    .module-card .mc-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 3px var(--red-soft)
    }

    /* ================================================================
   DATA CARDS
   ================================================================ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: none;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .08s
    }

    .card:hover {
      border-color: #BEC8C5;
      box-shadow: 0 3px 10px rgba(22, 32, 31, .055)
    }

    .card:active {
      transform: translateY(1px)
    }

    .card-accent {
      border-left: 3px solid var(--slate-300);
      padding-left: 14px
    }

    .card-accent.pri-emergencia {
      border-left-color: var(--red)
    }

    .card-accent.pri-urgente {
      border-left-color: var(--warn)
    }

    .card-accent.pri-normal {
      border-left-color: var(--vale)
    }

    .card-accent.pri-programada {
      border-left-color: var(--slate-400)
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px
    }

    .card-id {
      font-size: .64rem;
      font-weight: 750;
      color: var(--slate-500);
      letter-spacing: .06em;
      margin-bottom: 3px
    }

    .card-title {
      font-size: .86rem;
      font-weight: 660;
      line-height: 1.38;
      color: var(--slate-900)
    }

    .card-meta {
      font-size: .68rem;
      color: var(--text2);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 7px
    }

    .card-meta svg {
      width: 12px;
      height: 12px;
      vertical-align: middle;
      margin-right: 3px
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--slate-100)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid transparent;
      font-size: .59rem;
      font-weight: 780;
      letter-spacing: .045em;
      text-transform: uppercase;
      white-space: nowrap
    }

    .badge-aberta {
      background: var(--warn-soft);
      color: #7F4A05;
      border-color: #F0D9A9
    }

    .badge-triada {
      background: var(--info-soft);
      color: #245363;
      border-color: #CAE0E6
    }

    .badge-em_execucao {
      background: #E5F2F1;
      color: var(--vale-800);
      border-color: #C1E1DE
    }

    .badge-executada,
    .badge-concluida {
      background: var(--ok-soft);
      color: #1E654B;
      border-color: #C9E6D8
    }

    .badge-validada,
    .badge-encerrada {
      background: var(--slate-900);
      color: #fff;
      border-color: var(--slate-900)
    }

    .badge-cancelada {
      background: var(--slate-100);
      color: var(--slate-600);
      border-color: var(--border)
    }

    .badge-planejada {
      background: #EDF3F6;
      color: #3D5F6A;
      border-color: #D5E2E6
    }

    .badge-liberada {
      background: var(--gold-soft);
      color: #755A00;
      border-color: #EBD887
    }

    /* ================================================================
   LIFECYCLE / STATS
   ================================================================ */
    .lifecycle {
      display: flex;
      align-items: center;
      margin: 14px 0 4px
    }

    .lc-step {
      display: flex;
      align-items: center
    }

    .lc-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: var(--surface);
      flex-shrink: 0
    }

    .lc-dot.done {
      background: var(--ok);
      border-color: var(--ok)
    }

    .lc-dot.current {
      border-color: var(--vale);
      background: var(--vale);
      box-shadow: 0 0 0 3px rgba(0, 126, 122, .12)
    }

    .lc-line {
      width: 24px;
      height: 2px;
      background: var(--border);
      flex-shrink: 0
    }

    .lc-line.done {
      background: var(--ok)
    }

    .lc-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 5px
    }

    .lc-label {
      font-size: .51rem;
      color: var(--text3);
      text-align: center;
      flex: 1
    }

    .lc-label.done {
      color: var(--ok)
    }

    .lc-label.current {
      color: var(--vale-800);
      font-weight: 800
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 12px;
      text-align: left;
      position: relative;
      overflow: hidden
    }

    .stat::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--vale)
    }

    .stat-num {
      font-size: 1.62rem;
      font-weight: 760;
      color: var(--slate-950);
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .stat-label {
      font-size: .64rem;
      color: var(--text2);
      margin-top: 6px;
      font-weight: 650
    }

    .stat.highlight::before {
      background: var(--gold)
    }

    .stat.highlight .stat-num {
      color: #765A00
    }

    .stat.danger::before {
      background: var(--red)
    }

    .stat.danger .stat-num {
      color: var(--red)
    }

    /* ================================================================
   FORMS / ACTIONS
   ================================================================ */
    .field {
      margin-bottom: 16px
    }

    .field label {
      display: block;
      font-size: .7rem;
      font-weight: 720;
      color: var(--slate-700);
      margin-bottom: 7px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      font-size: .86rem;
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
      min-height: 42px
    }

    .field input:hover,
    .field select:hover,
    .field textarea:hover {
      border-color: var(--slate-400)
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--vale);
      box-shadow: var(--focus)
    }

    .field textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.5
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      min-height: 42px;
      border-radius: 7px;
      font-weight: 700;
      font-size: .84rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .08s, box-shadow .15s;
      width: 100%
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn-pri {
      background: var(--vale-800);
      border-color: var(--vale-800);
      color: #fff
    }

    .btn-pri:hover {
      background: var(--vale-900);
      border-color: var(--vale-900)
    }

    .btn-outline {
      background: #fff;
      border-color: var(--border-strong);
      color: var(--slate-800)
    }

    .btn-outline:hover {
      background: var(--slate-50);
      border-color: var(--slate-400)
    }

    .btn-sm {
      padding: 7px 12px;
      min-height: 34px;
      font-size: .75rem;
      width: auto
    }

    .foto-area {
      border: 1px dashed var(--slate-400);
      border-radius: 8px;
      padding: 26px;
      text-align: center;
      cursor: pointer;
      color: var(--text2);
      transition: border-color .15s, background .15s, color .15s;
      margin-bottom: 16px;
      background: var(--slate-50)
    }

    .foto-area:hover {
      border-color: var(--vale);
      color: var(--vale-800);
      background: #F7FCFB
    }

    .foto-area svg {
      width: 28px;
      height: 28px;
      margin: 0 auto 7px
    }

    .foto-area p {
      font-size: .8rem;
      font-weight: 700
    }

    .foto-area small {
      font-size: .67rem
    }

    .foto-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px
    }

    .foto-preview.has-photos {
      display: flex
    }

    .priority-pills {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .priority-pill {
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: .73rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .08s;
      background: var(--surface)
    }

    .priority-pill:hover {
      border-color: var(--vale)
    }

    .priority-pill:active {
      transform: translateY(1px)
    }

    .priority-pill.selected {
      border-color: var(--vale-800);
      background: var(--vale-800);
      color: #fff
    }

    .priority-pill.sel-emergencia {
      background: var(--red);
      border-color: var(--red)
    }

    .priority-pill.sel-urgente {
      background: var(--warn);
      border-color: var(--warn)
    }

    /* ================================================================
   FILTERS / DETAIL / DASHBOARD
   ================================================================ */
    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: thin
    }

    .filter-chip {
      padding: 7px 11px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: .68rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, border-color .15s, color .15s
    }

    .filter-chip:hover {
      border-color: var(--vale);
      color: var(--vale-800)
    }

    .filter-chip.active {
      background: var(--vale-800);
      color: #fff;
      border-color: var(--vale-800)
    }

    .detail-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px
    }

    .detail-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0
    }

    .detail-info-item {
      padding: 9px 10px;
      background: var(--slate-50);
      border: 1px solid var(--slate-100);
      border-radius: 6px
    }

    .detail-info-item label {
      font-size: .59rem;
      font-weight: 750;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .055em;
      display: block;
      margin-bottom: 3px
    }

    .detail-info-item span {
      font-size: .8rem;
      font-weight: 620
    }

    .detail-section {
      margin: 16px 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px
    }

    .detail-section h3 {
      font-size: .7rem;
      font-weight: 780;
      color: var(--slate-600);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 9px
    }

    .timeline {
      position: relative;
      padding-left: 22px
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--border)
    }

    .timeline-item {
      position: relative;
      padding-bottom: 16px
    }

    .timeline-item:last-child {
      padding-bottom: 0
    }

    .timeline-dot {
      position: absolute;
      left: -22px;
      top: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ok);
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px #BFDCCF
    }

    .timeline-dot.pending {
      background: var(--slate-300);
      box-shadow: 0 0 0 1px var(--border)
    }

    .timeline-item p {
      font-size: .78rem;
      font-weight: 650
    }

    .timeline-item small {
      font-size: .66rem;
      color: var(--text2)
    }

    .dash-chart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px
    }

    .dash-chart h3 {
      font-size: .72rem;
      font-weight: 780;
      color: var(--slate-700);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px
    }

    .bar-label {
      font-size: .68rem;
      width: 78px;
      flex-shrink: 0;
      text-align: right;
      font-weight: 600;
      color: var(--slate-700)
    }

    .bar-track {
      flex: 1;
      height: 14px;
      background: var(--slate-100);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--slate-150)
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .6s ease;
      background: var(--vale) !important
    }

    .bar-value {
      font-size: .67rem;
      font-weight: 750;
      width: 26px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums
    }

    /* ================================================================
   FEEDBACK / DEMO TOOLS
   ================================================================ */
    .toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--slate-950);
      color: #fff;
      padding: 10px 16px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, .10);
      font-size: .76rem;
      font-weight: 600;
      z-index: 300;
      transition: transform .3s ease;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(22, 32, 31, .18)
    }

    .toast.show {
      transform: translateX(-50%) translateY(0)
    }

    .demo-fab {
      position: fixed;
      bottom: 76px;
      right: 16px;
      z-index: 90;
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: var(--gold);
      color: var(--slate-950);
      border: 1px solid var(--gold-700);
      box-shadow: 0 4px 12px rgba(22, 32, 31, .14);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .08s, filter .15s
    }

    .demo-fab:hover {
      filter: brightness(.97)
    }

    .demo-fab:active {
      transform: translateY(1px)
    }

    .demo-fab svg {
      width: 16px;
      height: 16px
    }

    .demo-panel {
      position: fixed;
      bottom: 122px;
      right: 16px;
      z-index: 90;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px;
      box-shadow: 0 10px 24px rgba(22, 32, 31, .12);
      display: none;
      min-width: 190px
    }

    .demo-panel.show {
      display: block
    }

    .demo-panel button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid transparent;
      background: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600
    }

    .demo-panel button:hover {
      background: var(--slate-50);
      border-color: var(--border)
    }

    .demo-panel button.active {
      color: var(--vale-800);
      font-weight: 750;
      background: var(--teal-light)
    }

    .demo-panel .dt {
      font-size: .58rem;
      font-weight: 800;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .09em;
      padding: 4px 10px 6px
    }

    .empty {
      text-align: center;
      padding: 38px 20px;
      color: var(--text2);
      background: rgba(255, 255, 255, .55);
      border: 1px dashed var(--border-strong);
      border-radius: 8px
    }

    .empty p {
      font-size: .82rem;
      font-weight: 600
    }

    .back-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      cursor: pointer;
      padding: 6px 8px 6px 4px;
      border-radius: 6px;
      color: var(--slate-700)
    }

    .back-row:hover {
      color: var(--vale-800);
      background: var(--teal-light)
    }

    .back-row svg {
      width: 17px;
      height: 17px
    }

    .back-row span {
      font-weight: 700;
      font-size: .78rem
    }

    /* Desktop content rhythm */
    @media(min-width:900px) {
      .page-scroll {
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
        padding: 28px 34px 38px
      }

      .cards-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px
      }

      .cards-grid .card {
        margin-bottom: 0
      }

      #home-content>div[style*="flex:1"]>div {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto
      }
    }

    @media(min-width:600px) {
      .detail-info {
        grid-template-columns: repeat(4, 1fr)
      }

      .stats {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    @media(max-width:920px) {
      .module-grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    @media(max-width:700px) {
      #login {
        display: block
      }

      .login-right {
        display: none
      }

      .login-left {
        height: 100%;
        padding: 72px 24px 28px;
        justify-content: center
      }

      .login-left::before {
        left: 24px;
        top: 24px
      }

      .login-form::after {
        display: none
      }

      .login-logo {
        align-self: flex-start
      }

      .login-logo .vale-logo-img {
        width: 145px
      }
    }

    @media(max-width:560px) {
      :root {
        --header-h: 66px;
        --nav-h: 56px
      }

      .header {
        padding: 10px 12px;
        gap: 10px
      }

      .header-logo {
        min-width: 78px;
        height: 40px;
        padding: 5px 6px
      }

      .header-logo .vale-logo-img {
        width: 68px
      }

      .header-info .h-name {
        font-size: .85rem
      }

      .header-info .h-meta {
        font-size: .62rem
      }

      .module-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 14px 12px 10px
      }

      .module-card {
        min-height: 112px;
        padding: 13px
      }

      .module-card .mc-title {
        font-size: .69rem
      }

      .module-card .mc-icon {
        width: 34px;
        height: 34px
      }

      .page-scroll {
        padding: 18px 12px 26px
      }

      .nav {
        padding: 0 10px
      }

      .nav-right {
        gap: 2px
      }

      .nav-btn {
        width: 36px;
        height: 36px
      }

      .detail-info {
        grid-template-columns: 1fr 1fr
      }

      .demo-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:360px) {
      .module-grid {
        grid-template-columns: 1fr 1fr
      }

      .demo-grid {
        grid-template-columns: 1fr
      }

      .header-info .h-meta {
        display: none
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
     LOGIN
     ============================================================ -->
  <div id="login">
    <div class="login-left">

      return `<div class="card card-accent pri-${o.status === 'em_execucao' ? 'urgente' : 'normal'}" onclick="verDetalheOM('${o.id}')">
    <div class="card-header">
      <div><div class="card-id">OM-${String(o.numero).padStart(4, '0')}</div>
      <div class="card-title">${at ? at.tag + ' — ' : ''}${o.descricao_servico ? o.descricao_servico.slice(0, 55) + '…' : ''}</div></div>
      <span class="badge badge-${o.status}">${fS(o.status)}</span>
    </div>
    <div class="card-meta"><span>${IC.clock}${fD(o.criado_em)}</span>${ex ? '<span>' + ex.nome + '</span>' : '<span style="color:var(--warn)">Sem executante</span>'}</div>
    ${usuario.perfil === 'execucao' && o.status === 'em_execucao' ? '<div class="card-actions"><button class="btn btn-pri btn-sm" onclick="event.stopPropagation();concluirOM(\'' + o.id + '\')">' + IC.check + ' Concluir</button></div>' : ''}
  </div>`;
    }

    /* ================================================================
       LISTS
       ================================================================ */
    let nF = 'todos', oF = 'todos';
    function renderNotas() {
      const fb = document.getElementById('notas-filters'), l = document.getElementById('notas-list');
      ['todos', 'aberta', 'triada', 'em_execucao', 'executada', 'validada'].forEach(s => { });
      fb.innerHTML = ['todos', 'aberta', 'triada', 'em_execucao', 'executada', 'validada'].map(s =>
        `<button class="filter-chip${nF === s ? ' active' : ''}" onclick="nF='${s}';renderNotas()">${s === 'todos' ? 'Todas' : fS(s)}</button>`
      ).join('');
      let f = [...notas];
      if (nF !== 'todos') f = f.filter(n => n.status === nF);
      if (usuario.perfil === 'inspecao') f = f.filter(n => n.autor_id === usuario.id);
      f.sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
      l.innerHTML = f.length ? '<div class="cards-grid">' + f.map(renderNotaCard).join('') + '</div>' : '<div class="empty"><p>Nenhuma nota</p></div>';
    }
    function renderOrdens() {
      const fb = document.getElementById('ordens-filters'), l = document.getElementById('ordens-list');
      fb.innerHTML = ['todos', 'planejada', 'em_execucao', 'concluida'].map(s =>
        `<button class="filter-chip${oF === s ? ' active' : ''}" onclick="oF='${s}';renderOrdens()">${s === 'todos' ? 'Todas' : fS(s)}</button>`
      ).join('');
      let f = [...ordens];
      if (oF !== 'todos') f = f.filter(o => o.status === oF);
      if (usuario.perfil === 'execucao') f = f.filter(o => o.executante_id === usuario.id);
      f.sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
      l.innerHTML = f.length ? f.map(renderOMCard).join('') : '<div class="empty"><p>Nenhuma OM</p></div>';
    }

    /* ================================================================
       NOVA NOTA
       ================================================================ */
    let selPri = 'normal', fotoSim = false;
    function renderNovaNota() {
      const sel = document.getElementById('nota-ativo');
      if (sel.options.length <= 1) ATIVOS.forEach(a => { const o = document.createElement('option'); o.value = a.id; o.textContent = a.tag + ' — ' + a.descricao; sel.appendChild(o) });
      selPri = 'normal'; fotoSim = false;
      document.getElementById('foto-preview').className = 'foto-preview';
      document.getElementById('foto-preview').innerHTML = '';
      document.getElementById('foto-area').style.display = '';
      document.getElementById('nota-desc').value = '';
      document.getElementById('nota-ativo').value = '';
      document.querySelectorAll('.priority-pill').forEach(p => { p.classList.remove('selected', 'sel-emergencia', 'sel-urgente'); if (p.dataset.pri === 'normal') p.classList.add('selected') });
    }
    document.addEventListener('click', e => {
      if (e.target.classList.contains('priority-pill')) {
        document.querySelectorAll('.priority-pill').forEach(p => p.classList.remove('selected', 'sel-emergencia', 'sel-urgente'));
        selPri = e.target.dataset.pri; e.target.classList.add('selected');
        if (selPri === 'emergencia') e.target.classList.add('sel-emergencia');
        if (selPri === 'urgente') e.target.classList.add('sel-urgente');
      }
    });
    function simularFoto() {
      fotoSim = true; document.getElementById('foto-area').style.display = 'none';
      const p = document.getElementById('foto-preview'); p.className = 'foto-preview has-photos';
      p.innerHTML = '<div style="width:68px;height:68px;border-radius:6px;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:1px solid var(--border)">📷</div><div style="font-size:.72rem;color:var(--text2);align-self:center">Foto capturada</div>';
    }
    function criarNota() {
      const ai = document.getElementById('nota-ativo').value, d = document.getElementById('nota-desc').value.trim(), di = document.getElementById('nota-disciplina').value;
      if (!ai) { toast('Selecione o ativo'); return } if (!d) { toast('Descreva o problema'); return }
      notaC++;
      const nn = { id: 'n' + Date.now(), numero: notaC, autor_id: usuario.id, ativo_id: ai, origem: 'inspecao_pontual', disciplina: di, prioridade: selPri, descricao: d, foto_url: fotoSim ? '📷' : null, status: 'aberta', triado_por: null, criado_em: new Date().toISOString(), atualizado_em: new Date().toISOString() };
      notas.push(nn);
      eventos.push({ id: 'e' + Date.now(), tabela: 'nota', registro_id: nn.id, acao: 'Nota criada', usuario_id: usuario.id, criado_em: nn.criado_em });
      toast('NT-' + String(notaC).padStart(4, '0') + ' registrada'); navTo('home');
    }

    /* ================================================================
       DETALHE
       ================================================================ */
    function verDetalhe(id) {
      const n = notas.find(x => x.id === id); if (!n) return;
      const at = A(n.ativo_id), au = U(n.autor_id), tr = n.triado_por ? U(n.triado_por) : null;
      const om = ordens.find(o => o.nota_id === id);
      const ev = eventos.filter(e => e.registro_id === id || (om && e.registro_id === om.id)).sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
      const steps = ['aberta', 'triada', 'em_execucao', 'executada', 'validada'], ci = steps.indexOf(n.status);

      document.getElementById('detalhe-content').innerHTML = `
    <div class="back-row" onclick="navTo('notas')">${IC.back}<span>Voltar</span></div>
    <div class="detail-header">
      <div class="card-header"><div><div class="card-id">NT-${String(n.numero).padStart(4, '0')}</div><div class="card-title">${at ? at.descricao : ''}</div></div><span class="badge badge-${n.status}">${fS(n.status)}</span></div>
      <div class="lifecycle">${steps.map((s, i) => `<div class="lc-step"><div class="lc-dot${i < ci ? ' done' : ''}${i === ci ? ' current' : ''}"></div>${i < steps.length - 1 ? '<div class="lc-line' + (i < ci ? ' done' : '') + '"></div>' : ''}</div>`).join('')}</div>
      <div class="lc-labels">${steps.map((s, i) => `<span class="lc-label${i < ci ? ' done' : ''}${i === ci ? ' current' : ''}">${fS(s)}</span>`).join('')}</div>
    </div>
    <div class="detail-info">
      <div class="detail-info-item"><label>Ativo</label><span>${at ? at.tag : ''}</span></div>
      <div class="detail-info-item"><label>Sistema</label><span>${at ? at.sistema : ''}</span></div>
      <div class="detail-info-item"><label>Prioridade</label><span>${fPr(n.prioridade)}</span></div>
      <div class="detail-info-item"><label>Disciplina</label><span>${n.disciplina}</span></div>
      <div class="detail-info-item"><label>Autor</label><span>${au ? au.nome : ''}</span></div>
      <div class="detail-info-item"><label>Data</label><span>${fD(n.criado_em)}</span></div>
      ${tr ? '<div class="detail-info-item"><label>Triada por</label><span>' + tr.nome + '</span></div>' : ''}
      ${om ? '<div class="detail-info-item"><label>OM</label><span>OM-' + String(om.numero).padStart(4, '0') + '</span></div>' : ''}
    </div>
    <div class="detail-section"><h3>Descrição</h3><p style="font-size:.84rem;line-height:1.5">${n.descricao}</p></div>
    ${n.foto_url ? '<div class="detail-section"><h3>Evidência</h3><div style="width:100px;height:75px;background:var(--teal-light);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem">📷</div></div>' : ''}
    <div class="detail-section"><h3>Histórico</h3>
      <div class="timeline">${ev.map(e => { const eu = U(e.usuario_id); return '<div class="timeline-item"><div class="timeline-dot"></div><p>' + e.acao + '</p><small>' + (eu ? eu.nome : '') + ' · ' + fD(e.criado_em) + '</small></div>' }).join('')}
      ${n.status !== 'validada' ? '<div class="timeline-item"><div class="timeline-dot pending"></div><p style="color:var(--text3)">Aguardando próxima etapa</p></div>' : ''}</div>
    </div>
    ${renderAcoes(n, om)}
  `;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pg-detalhe').classList.add('active');
    }

    function renderAcoes(n, om) {
      let h = '<div style="display:flex;flex-direction:column;gap:8px">';
      if (usuario.perfil === 'pcm' && n.status === 'aberta') h += `<button class="btn btn-pri" onclick="triarNota('${n.id}')">Triar e gerar OM</button>`;
      if (usuario.perfil === 'execucao' && om && om.status === 'em_execucao') h += `<button class="btn btn-pri" onclick="concluirOM('${om.id}')">Marcar concluída</button>`;
      if (usuario.perfil === 'inspecao' && n.status === 'executada' && n.autor_id === usuario.id) h += `<button class="btn btn-pri" onclick="validarNota('${n.id}')">Validar execução</button>`;
      return h + '</div>';
    }
    function verDetalheOM(id) { const o = ordens.find(x => x.id === id); if (o && o.nota_id) verDetalhe(o.nota_id) }

    /* ================================================================
       ACTIONS
       ================================================================ */
    function triarNota(id) {
      const n = notas.find(x => x.id === id); if (!n) return;
      n.status = 'em_execucao'; n.triado_por = usuario.id; n.atualizado_em = new Date().toISOString();
      eventos.push({ id: 'e' + Date.now(), tabela: 'nota', registro_id: id, acao: 'Triada pelo PCM', usuario_id: usuario.id, criado_em: new Date().toISOString() });
      omC++;
      const no = { id: 'o' + Date.now(), numero: omC, nota_id: id, ativo_id: n.ativo_id, tipo: 'corretiva', descricao_servico: 'Verificar e corrigir: ' + n.descricao.slice(0, 80), executante_id: 'u3', status: 'em_execucao', planejado_para: new Date().toISOString().slice(0, 10), criado_em: new Date().toISOString(), atualizado_em: new Date().toISOString() };
      ordens.push(no);
      eventos.push({ id: 'e' + Date.now() + 'b', tabela: 'ordem_manutencao', registro_id: no.id, acao: 'OM gerada e atribuída', usuario_id: usuario.id, criado_em: new Date().toISOString() });
      toast('OM-' + String(omC).padStart(4, '0') + ' gerada'); verDetalhe(id);
    }
    function concluirOM(id) {
      const o = ordens.find(x => x.id === id); if (!o) return;
      o.status = 'concluida'; o.atualizado_em = new Date().toISOString();
      const n = notas.find(x => x.id === o.nota_id); if (n) { n.status = 'executada'; n.atualizado_em = new Date().toISOString() }
      eventos.push({ id: 'e' + Date.now(), tabela: 'ordem_manutencao', registro_id: id, acao: 'Execução concluída', usuario_id: usuario.id, criado_em: new Date().toISOString() });
      toast('OM concluída'); navTo('home');
    }
    function validarNota(id) {
      const n = notas.find(x => x.id === id); if (!n) return;
      n.status = 'validada'; n.atualizado_em = new Date().toISOString();
      const o = ordens.find(x => x.nota_id === id); if (o) { o.status = 'encerrada'; o.atualizado_em = new Date().toISOString() }
      eventos.push({ id: 'e' + Date.now(), tabela: 'nota', registro_id: id, acao: 'Execução validada pelo autor', usuario_id: usuario.id, criado_em: new Date().toISOString() });
      toast('Ciclo completo — nota validada'); verDetalhe(id);
    }

    /* ================================================================
       DASHBOARD
       ================================================================ */
    function renderDashboard() {
      const c = document.getElementById('dash-content');
      const ab = notas.filter(n => n.status === 'aberta').length, ex = notas.filter(n => n.status === 'em_execucao').length;
      const val = notas.filter(n => n.status === 'validada').length, tot = notas.length;
      const emerg = notas.filter(n => n.prioridade === 'emergencia' && !['validada', 'cancelada'].includes(n.status));
      c.innerHTML = `
    <div class="stats">
      <div class="stat${ab ? ' danger' : ''}"><div class="stat-num">${ab}</div><div class="stat-label">Abertas</div></div>
      <div class="stat"><div class="stat-num">${ex}</div><div class="stat-label">Em execução</div></div>
      <div class="stat"><div class="stat-num">${ordens.filter(o => o.status === 'em_execucao').length}</div><div class="stat-label">OMs ativas</div></div>
      <div class="stat highlight"><div class="stat-num">${val}</div><div class="stat-label">Validadas</div></div>
    </div>
    ${emerg.length ? '<div class="section-label" style="color:var(--red)">Emergências ativas</div>' + emerg.map(renderNotaCard).join('') : ''}
    <div class="dash-chart"><h3>Notas por status</h3>
      ${[{ l: 'Abertas', v: ab, c: 'var(--warn)' }, { l: 'Execução', v: ex, c: 'var(--purple)' }, { l: 'Validadas', v: val, c: 'var(--ok)' }].map(r => `<div class="bar-row"><div class="bar-label">${r.l}</div><div class="bar-track"><div class="bar-fill" style="width:${tot ? r.v / tot * 100 : 0}%;background:${r.c}"></div></div><div class="bar-value">${r.v}</div></div>`).join('')}
    </div>
    <div class="dash-chart"><h3>Notas por sistema</h3>
      ${['ETA', 'BSR', 'Britagem', 'Wind Fence'].map(s => { const cn = notas.filter(n => { const a = A(n.ativo_id); return a && a.sistema === s }).length; return `<div class="bar-row"><div class="bar-label">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${tot ? cn / tot * 100 : 0}%;background:var(--teal)"></div></div><div class="bar-value">${cn}</div></div>` }).join('')}
    </div>
    <div class="section-label">Últimos eventos</div>
    <div class="timeline" style="margin-bottom:20px">
      ${eventos.sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em)).slice(0, 6).map(e => { const eu = U(e.usuario_id); return '<div class="timeline-item"><div class="timeline-dot"></div><p>' + e.acao + '</p><small>' + (eu ? eu.nome : '') + ' · ' + fD(e.criado_em) + '</small></div>' }).join('')}
    </div>
  `;
    }
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</body>

</html>
